<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <meta name="description" content="Lumers — Gestão Financeira inteligente">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lumers">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <title>Lumers Gestão Financeira</title>
</head>
<body>
  <div id="auth-screen" style="display:none;position:fixed;inset:0;z-index:9999;background:var(--bg);align-items:center;justify-content:center">
    <div style="width:100%;max-width:400px;padding:24px">
      <div style="text-align:center;margin-bottom:28px">
        <svg width="44" height="44" viewBox="0 0 28 28" fill="none" style="margin:0 auto 10px;display:block">
          <rect width="28" height="28" rx="8" fill="#2563EB"/>
          <rect x="7" y="13" width="14" height="2" rx="1" fill="#fff"/>
          <rect x="7" y="9" width="9" height="2" rx="1" fill="rgba(255,255,255,.55)"/>
          <rect x="7" y="17" width="11" height="2" rx="1" fill="rgba(255,255,255,.35)"/>
        </svg>
        <div style="font-size:1.4rem;font-weight:800;color:var(--text);letter-spacing:-.02em">Lumers</div>
      </div>
      <div class="card" style="padding:28px">
        <div id="auth-title" style="font-size:1.15rem;font-weight:600;margin-bottom:20px;color:var(--text)">Entrar</div>
        <div id="auth-name-group" class="form-group" style="display:none">
          <label class="form-label">Nome</label>
          <input id="auth-name" class="form-control" type="text" placeholder="Seu nome" autocomplete="name">
        </div>
        <div id="auth-phone-group" class="form-group" style="display:none">
          <label class="form-label">WhatsApp (DDI + DDD + número)</label>
          <input id="auth-phone" class="form-control" type="tel" inputmode="numeric" placeholder="Ex: 5561999990000">
        </div>
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input id="auth-email" class="form-control" type="email" placeholder="seu@email.com" autocomplete="email">
        </div>
        <div id="auth-password-group" class="form-group">
          <label class="form-label">Senha</label>
          <input id="auth-password" class="form-control" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div id="auth-forgot-link" style="text-align:right;margin-top:-4px;margin-bottom:8px">
          <a href="#" onclick="toggleForgotMode(event)" style="font-size:.82rem;color:var(--primary)">Esqueci minha senha</a>
        </div>
        <div id="auth-confirm-group" class="form-group" style="display:none">
          <label class="form-label">Confirmar senha</label>
          <input id="auth-confirm" class="form-control" type="password" placeholder="••••••••" autocomplete="new-password">
        </div>
        <button id="auth-submit" class="btn btn-primary" style="width:100%;margin-top:8px;padding:12px" onclick="submitAuth()">Entrar</button>
        <p style="text-align:center;margin-top:16px;font-size:.88rem;color:var(--text-muted)">
          <span id="auth-toggle-text">Não tem conta?</span>
          <a href="#" id="auth-toggle" onclick="toggleAuthMode(event)" style="color:var(--primary);margin-left:4px">Criar conta</a>
        </p>
      </div>
    </div>
  </div>

  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="8" fill="#2563EB"/>
            <rect x="7" y="13" width="14" height="2" rx="1" fill="#fff"/>
            <rect x="7" y="9" width="9" height="2" rx="1" fill="rgba(255,255,255,.55)"/>
            <rect x="7" y="17" width="11" height="2" rx="1" fill="rgba(255,255,255,.35)"/>
          </svg>
          <span>Lumers</span>
        </div>
        <button class="sidebar-close" id="sidebarClose" aria-label="Fechar menu">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M15 5L5 15M5 5l10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="#/" class="nav-item" data-page="dashboard">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="11" y="2" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="2" y="11" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="11" y="11" width="7" height="7" rx="1.5" fill="currentColor"/></svg>
          Dashboard
        </a>
        <a href="#/bills" class="nav-item" data-page="bills">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 4h12a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.5"/><path d="M7 8h6M7 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Contas a Pagar
        </a>
        <a href="#/daily" class="nav-item" data-page="daily">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 7v3.5l2.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Gastos do Dia
        </a>
        <a href="#/expenses" class="nav-item" data-page="expenses">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 4h12a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.5"/><path d="M7 10h6M10 7v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Gastos Gerais
        </a>
        <a href="#/income" class="nav-item" data-page="income">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3v14M6 7l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Faturamento
        </a>
        <a href="#/categories" class="nav-item" data-page="categories">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 10l-4-4M10 10h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Categorias
        </a>
        <a href="#/recurring" class="nav-item" data-page="recurring">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 10a6 6 0 1 1 2 4.47" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4 14v-4h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Recorrências
        </a>
        <a href="#/installments" class="nav-item" data-page="installments">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="5" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 10h2M11 10h2M7 13h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Parcelamentos
        </a>
        <a href="#/goals" class="nav-item" data-page="goals">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Metas
        </a>
        <a href="#/reports" class="nav-item" data-page="reports">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 17V8l4-4 4 4 4-5v14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Relatórios
        </a>
        <a href="#/import" class="nav-item" data-page="import">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3v10M6 9l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Importar
        </a>
        <a href="#/settings" class="nav-item" data-page="settings">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" stroke="currentColor" stroke-width="1.5"/><path d="M17 10a7.08 7.08 0 0 0-.07-1l1.52-1.19a.4.4 0 0 0 .09-.5l-1.44-2.5a.4.4 0 0 0-.49-.18l-1.79.72a7 7 0 0 0-1.72-1l-.27-1.9A.39.39 0 0 0 12.44 3h-2.88a.39.39 0 0 0-.38.33l-.27 1.9a7 7 0 0 0-1.72 1L5.4 5.5a.4.4 0 0 0-.49.17L3.46 8.17a.4.4 0 0 0 .09.5L5.07 9.86A7.08 7.08 0 0 0 5 11a7.08 7.08 0 0 0 .07 1L3.55 13.19a.4.4 0 0 0-.09.5l1.44 2.5a.4.4 0 0 0 .49.18l1.79-.72a7 7 0 0 0 1.72 1l.27 1.9c.05.19.22.33.42.33h2.88a.39.39 0 0 0 .38-.33l.27-1.9a7 7 0 0 0 1.72-1l1.79.72a.4.4 0 0 0 .49-.17l1.44-2.5a.4.4 0 0 0-.09-.5L16.93 11A7.08 7.08 0 0 0 17 10z" stroke="currentColor" stroke-width="1.5"/></svg>
          Configurações
        </a>
        <a href="#/admin" class="nav-item" data-page="admin" id="admin-nav-link" style="display:none">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M4 17c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Usuários
        </a>
      </nav>
      <div style="padding:16px;border-top:1px solid rgba(255,255,255,.06);margin-top:auto">
        <div id="user-name" style="font-size:.8rem;color:var(--sidebar-text);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
        <button class="nav-item" style="width:100%;text-align:left;color:#ef4444" onclick="logout()">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13 15l4-5-4-5M17 10H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 3H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Sair
        </button>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 6h16M3 11h16M3 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="topbar-title" id="pageTitle">Dashboard</div>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>

      <div class="content" id="content">
        <div class="loading-screen">
          <div class="spinner"></div>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="#/" class="bottom-nav-item" data-page="dashboard">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="11" y="2" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="2" y="11" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="11" y="11" width="7" height="7" rx="1.5" fill="currentColor"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#/bills" class="bottom-nav-item" data-page="bills">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none"><path d="M4 4h12a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.5"/><path d="M7 8h6M7 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Contas</span>
      </a>
      <a href="#/income" class="bottom-nav-item" data-page="income">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none"><path d="M10 3v14M6 7l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Receitas</span>
      </a>
      <a href="#/reports" class="bottom-nav-item" data-page="reports">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none"><path d="M3 17V8l4-4 4 4 4-5v14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Relatórios</span>
      </a>
      <a href="#/expenses" class="bottom-nav-item" data-page="expenses">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none"><path d="M4 4h12a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.5"/><path d="M7 10h6M10 7v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Gastos</span>
      </a>
    </nav>
  </div>

  <button id="fab" aria-label="Lançamento rápido">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </button>

  <div id="modal-container"></div>
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/bills.js"></script>
  <script src="js/pages/daily.js"></script>
  <script src="js/pages/income.js"></script>
  <script src="js/pages/categories.js"></script>
  <script src="js/pages/recurring.js"></script>
  <script src="js/pages/installments.js"></script>
  <script src="js/pages/goals.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/expenses.js"></script>
  <script src="js/pages/import.js"></script>
  <script src="js/fab.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/pages/onboarding.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
